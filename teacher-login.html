<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#173b8f">

  <title>Teacher Login - Mule Learner Tuition</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #172033;
    }

    .app {
      max-width: 480px;
      min-height: 100vh;
      margin: auto;
      background: white;
      padding: 30px 20px;
    }

    .logo {
      text-align: center;
      margin-top: 35px;
    }

    .logo-icon {
      width: 78px;
      height: 78px;
      margin: auto;
      border-radius: 21px;
      background: #173b8f;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
    }

    .logo h1 {
      color: #173b8f;
      font-size: 22px;
      margin-top: 12px;
    }

    .logo p {
      color: #6b7280;
      font-size: 13px;
      margin-top: 5px;
    }

    .form {
      margin-top: 50px;
    }

    .form h2 {
      font-size: 24px;
    }

    .form > p {
      color: #6b7280;
      font-size: 14px;
      margin-top: 7px;
      margin-bottom: 25px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d9e0eb;
      border-radius: 11px;
      font-size: 14px;
      outline: none;
    }

    .button {
      width: 100%;
      padding: 15px;
      margin-top: 8px;
      border: none;
      border-radius: 12px;
      background: #173b8f;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .register {
      text-align: center;
      margin-top: 22px;
      color: #6b7280;
      font-size: 13px;
    }

    .register a {
      color: #2563eb;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="logo">

    <div class="logo-icon">
      👨‍🏫
    </div>

    <h1>MULE LEARNER TUITION</h1>

    <p>Teacher Administration</p>

  </div>


  <div class="form">

    <h2>Teacher Login</h2>

    <p>Sign in to manage your online classes.</p>


    <div class="field">

      <label>Phone Number</label>

      <input
        type="tel"
        id="phone"
        placeholder="Enter your phone number"
      >

    </div>


    <div class="field">

      <label>Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
      >

    </div>


    <button class="button" onclick="teacherLogin()">
      Login as Teacher
    </button>


    <div class="register">

      Don't have a teacher account?

      <a href="teacher-register.html">
        Register
      </a>

    </div>

  </div>

</div>


<script>

function teacherLogin() {

  const phone =
    document.getElementById("phone").value.trim();

  const password =
    document.getElementById("password").value;


  const savedPhone =
    localStorage.getItem("teacherPhone");

  const savedPassword =
    localStorage.getItem("teacherPassword");


  if (!phone || !password) {

    alert(
      "Please enter your phone number and password."
    );

    return;
  }


  if (
    phone === savedPhone &&
    password === savedPassword
  ) {

    localStorage.setItem(
      "teacherLoggedIn",
      "true"
    );

    window.location.href =
      "teacher.html";

  } else {

    alert(
      "Incorrect phone number or password."
    );

  }

}

</script>

</body>
</html>

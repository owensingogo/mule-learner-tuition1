<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Live Class - Mule Learner Tuition</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #111827;
      color: white;
    }

    .app {
      max-width: 500px;
      min-height: 100vh;
      margin: auto;
      padding: 20px;
    }

    .card {
      margin-top: 60px;
      background: #1f2937;
      padding: 25px;
      border-radius: 18px;
    }

    h1 {
      font-size: 24px;
      text-align: center;
    }

    p {
      color: #9ca3af;
      text-align: center;
      line-height: 1.5;
    }

    input {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      margin-top: 20px;
      outline: none;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      font-size: 15px;
    }

    .status {
      margin-top: 20px;
      text-align: center;
      color: #9ca3af;
    }

    .success {
      color: #22c55e;
    }

    .danger {
      color: #ef4444;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="card">

    <h1>📚 Join Live Class</h1>

    <p>
      Enter your name and request permission
      to join the teacher's live class.
    </p>

    <input
      id="learnerName"
      type="text"
      placeholder="Enter your name"
    >

    <button onclick="requestToJoin()">
      👋 Request to Join
    </button>

    <div
      id="status"
      class="status">
    </div>

  </div>

</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getDatabase,
  ref,
  push,
  set,
  onValue
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyCRW0JTsN5kQ5De-MgoN8Bd6u2tVvmLF7M",

  authDomain:
    "mule-learner-tuition-264fe.firebaseapp.com",

  databaseURL:
    "https://mule-learner-tuition-264fe-default-rtdb.firebaseio.com",

  projectId:
    "mule-learner-tuition-264fe",

  storageBucket:
    "mule-learner-tuition-264fe.firebasestorage.app",

  messagingSenderId:
    "656883565460",

  appId:
    "1:656883565460:web:3aaa6a5b638a34a6d28581"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getDatabase(app);


let requestId = null;


window.requestToJoin =
  async function() {

    const name =
      document
        .getElementById("learnerName")
        .value
        .trim();


    const status =
      document.getElementById("status");


    if (!name) {

      status.textContent =
        "Please enter your name.";

      status.className =
        "status danger";

      return;

    }


    try {

      const requestsRef =
        ref(db, "liveClass/requests");


      const newRequest =
        push(requestsRef);


      requestId =
        newRequest.key;


      await set(
        newRequest,
        {
          name: name,
          status: "waiting",
          requestedAt: Date.now()
        }
      );


      status.textContent =
        "⏳ Waiting for teacher approval...";

      status.className =
        "status";


      watchApproval();

    }

    catch(error) {

      console.error(error);

      status.textContent =
        "Unable to send request. Please try again.";

      status.className =
        "status danger";

    }

  };


function watchApproval() {

  if (!requestId) return;


  const requestRef =
    ref(
      db,
      "liveClass/requests/" + requestId
    );


  onValue(
    requestRef,
    snapshot => {

      const data =
        snapshot.val();


      if (!data) return;


      const status =
        document.getElementById("status");


      if (data.status === "approved") {

        status.textContent =
          "✅ Approved! Opening live class...";

        status.className =
          "status success";


        setTimeout(
          () => {

            window.location.href =
              "class.html?learner=true";

          },
          1200
        );

      }


      if (data.status === "rejected") {

        status.textContent =
          "❌ Your request was not approved.";

        status.className =
          "status danger";

      }

    }
  );

}

</script>

</body>
</html>

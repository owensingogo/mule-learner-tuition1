<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Registration - Mule Learner Tuition</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #172033;
    }

    .app {
      max-width: 480px;
      min-height: 100vh;
      margin: auto;
      background: white;
      padding: 25px 20px;
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo-icon {
      width: 70px;
      height: 70px;
      margin: auto;
      border-radius: 20px;
      background: #173b8f;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
    }

    .logo h1 {
      color: #173b8f;
      font-size: 21px;
      margin-top: 10px;
    }

    .subtitle {
      color: #6b7280;
      font-size: 13px;
      margin-top: 5px;
    }

    h2 {
      font-size: 23px;
      margin-bottom: 7px;
    }

    .description {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 22px;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #d8dfeb;
      border-radius: 11px;
      font-size: 14px;
      outline: none;
      background: white;
    }

    .button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 11px;
      background: #173b8f;
      color: white;
      font-size: 15px;
      font-weight: bold;
      margin-top: 8px;
    }

    .login {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #6b7280;
    }

    .login a {
      color: #2563eb;
      font-weight: bold;
      text-decoration: none;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #eef5ff;
      color: #173b8f;
      font-size: 13px;
      display: none;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="logo">

    <div class="logo-icon">
      👨‍🏫
    </div>

    <h1>MULE LEARNER TUITION</h1>

    <p class="subtitle">
      Learn • Practice • Succeed
    </p>

  </div>


  <h2>Teacher Registration</h2>

  <p class="description">
    Create your teacher account.
  </p>


  <div class="field">

    <label>Full Name</label>

    <input
      type="text"
      id="name"
      placeholder="Enter your full name"
    >

  </div>


  <div class="field">

    <label>Phone Number</label>

    <input
      type="tel"
      id="phone"
      placeholder="Enter your phone number"
    >

  </div>


  <div class="field">

    <label>Subject You Teach</label>

    <select id="subject">

      <option value="">
        Select subject
      </option>

      <option>Mathematics</option>
      <option>Computer Studies</option>
      <option>English</option>
      <option>Science</option>
      <option>Chemistry</option>
      <option>Biology</option>
      <option>Social Studies</option>
      <option>Civic Education</option>

    </select>

  </div>


  <div class="field">

    <label>Password</label>

    <input
      type="password"
      id="password"
      placeholder="Create a password"
    >

  </div>


  <div class="field">

    <label>Confirm Password</label>

    <input
      type="password"
      id="confirmPassword"
      placeholder="Confirm your password"
    >

  </div>


  <button
    class="button"
    onclick="registerTeacher()">

    Create Teacher Account

  </button>


  <div id="message" class="message"></div>


  <div class="login">

    Already have an account?

    <a href="teacher-login.html">
      Teacher Login
    </a>

  </div>

</div>


<script>

function registerTeacher() {

  const name =
    document.getElementById("name").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const subject =
    document.getElementById("subject").value;

  const password =
    document.getElementById("password").value;

  const confirmPassword =
    document.getElementById("confirmPassword").value;


  if (
    !name ||
    !phone ||
    !subject ||
    !password ||
    !confirmPassword
  ) {

    showMessage(
      "Please complete all the fields."
    );

    return;
  }


  if (password.length < 6) {

    showMessage(
      "Password must be at least 6 characters."
    );

    return;
  }


  if (password !== confirmPassword) {

    showMessage(
      "Passwords do not match."
    );

    return;
  }


  localStorage.setItem(
    "teacherName",
    name
  );

  localStorage.setItem(
    "teacherPhone",
    phone
  );

  localStorage.setItem(
    "teacherSubject",
    subject
  );

  localStorage.setItem(
    "teacherPassword",
    password
  );


  localStorage.setItem(
    "teacherLoggedIn",
    "true"
  );


  alert(
    "Teacher account created successfully!"
  );


  window.location.href =
    "teacher.html";

}


function showMessage(text) {

  const message =
    document.getElementById("message");

  message.textContent = text;

  message.style.display = "block";

}

</script>

</body>
</html>

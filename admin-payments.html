<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Payments - Mule Learner Tuition</title>

<style>
*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f3f4f6;
  color:#111827;
}

.app{
  max-width:700px;
  margin:auto;
  min-height:100vh;
}

header{
  background:#2563eb;
  color:white;
  padding:20px;
}

header h1{
  margin:0;
  font-size:22px;
}

header p{
  margin:6px 0 0;
  opacity:.9;
}

.content{
  padding:18px;
}

.summary{
  background:white;
  padding:16px;
  border-radius:14px;
  margin-bottom:18px;
  font-weight:bold;
}

.payment{
  background:white;
  border-radius:16px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 2px 8px #00000012;
}

.payment h3{
  margin:0 0 12px;
}

.detail{
  margin:8px 0;
  font-size:14px;
  color:#4b5563;
}

.detail strong{
  color:#111827;
}

.pending{
  color:#d97706;
  font-weight:bold;
}

.approved{
  color:#16a34a;
  font-weight:bold;
}

.rejected{
  color:#dc2626;
  font-weight:bold;
}

.expired{
  color:#6b7280;
  font-weight:bold;
}

.buttons{
  display:flex;
  gap:10px;
  margin-top:16px;
}

button{
  flex:1;
  padding:12px;
  border:0;
  border-radius:9px;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.approve{
  background:#16a34a;
}

.reject{
  background:#dc2626;
}

.empty{
  background:white;
  padding:25px;
  text-align:center;
  border-radius:15px;
  color:#6b7280;
}

.expiry-box{
  margin-top:12px;
  padding:12px;
  background:#ecfdf5;
  border-radius:10px;
  font-size:13px;
}
</style>
</head>

<body>

<div class="app">

<header>
  <h1>💰 Payment Verification</h1>
  <p>Mule Learner Tuition Admin</p>
</header>

<div class="content">

<div class="summary">
  Pending Payments:
  <span id="pendingCount">0</span>
</div>

<div id="payments">
  <div class="empty">
    Loading payments...
  </div>
</div>

</div>

</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue,
  update
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyCRW0JTsN5kQ5De-MgoN8Bd6u2tVvmLF7M",

  authDomain:
    "mule-learner-tuition-264fe.firebaseapp.com",

  databaseURL:
    "https://mule-learner-tuition-264fe-default-rtdb.firebaseio.com",

  projectId:
    "mule-learner-tuition-264fe",

  storageBucket:
    "mule-learner-tuition-264fe.firebasestorage.app",

  messagingSenderId:
    "656883565460",

  appId:
    "1:656883565460:web:3aaa6a5b638a34a6d28581"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getDatabase(app);


const paymentsRef =
  ref(db,"payments");


function getDuration(plan){

  if(plan === "3 Hours"){
    return 3 * 60 * 60 * 1000;
  }

  if(plan === "Daily"){
    return 24 * 60 * 60 * 1000;
  }

  if(plan === "Weekly"){
    return 7 * 24 * 60 * 60 * 1000;
  }

  if(plan === "Monthly"){
    return 30 * 24 * 60 * 60 * 1000;
  }

  return 0;
}


function formatDate(timestamp){

  if(!timestamp){
    return "Unknown";
  }

  return new Date(timestamp)
    .toLocaleString();

}


onValue(
  paymentsRef,
  snapshot => {

    const data =
      snapshot.val() || {};

    const container =
      document.getElementById(
        "payments"
      );

    container.innerHTML = "";


    const entries =
      Object.entries(data)
      .reverse();


    const pending =
      entries.filter(
        ([id,payment]) =>
          payment.status === "pending"
      ).length;


    document.getElementById(
      "pendingCount"
    ).textContent = pending;


    if(!entries.length){

      container.innerHTML =
        `<div class="empty">
          No payment requests yet.
        </div>`;

      return;

    }


    entries.forEach(
      ([id,payment]) => {

        const box =
          document.createElement(
            "div"
          );

        box.className =
          "payment";


        let buttons = "";


        if(payment.status === "pending"){

          buttons = `

            <div class="buttons">

              <button
                class="approve"
                onclick="approvePayment('${id}')">
                ✅ Approve
              </button>

              <button
                class="reject"
                onclick="rejectPayment('${id}')">
                ❌ Reject
              </button>

            </div>

          `;

        }


        let expiry = "";


        if(
          payment.status === "approved" &&
          payment.expiresAt
        ){

          expiry = `

            <div class="expiry-box">

              🔓 Access expires:

              <strong>
                ${formatDate(payment.expiresAt)}
              </strong>

            </div>

          `;

        }


        box.innerHTML = `

          <h3>
            💰 Payment Received From:
            ${payment.learnerName || "Learner"}
          </h3>

          <div class="detail">
            📱 Phone:
            <strong>
              ${payment
